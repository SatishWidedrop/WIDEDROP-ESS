<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0F1622" />
    <meta name="description" content="Widedrop Technologies employee self-service portal." />

    <!-- This portal holds employee and payroll data; it must never be indexed
         or previewed by a crawler. -->
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Widedrop Employee Portal</title>

    <link rel="icon" type="image/png" href="/widedrop-logo.png" />
    <link rel="apple-touch-icon" href="/widedrop-logo.png" />

    <!-- The two font files that render the first paint. The rest load on demand
         through their unicode-range. -->
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="noscript">
        <h1>JavaScript is required</h1>
        <p>
          The Widedrop employee portal needs JavaScript enabled. If it is blocked by a company
          policy on this device, contact
          <a href="mailto:helpdesk@widedroptech.com">helpdesk@widedroptech.com</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
