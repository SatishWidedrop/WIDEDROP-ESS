<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0F1622" />
    <meta name="description" content="Widedrop Technologies employee self-service portal." />

    <!-- This portal holds employee and payroll data; it must never be indexed
         or previewed by a crawler. -->
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Widedrop Employee Portal</title>

    <link rel="icon" type="image/png" href="/widedrop-logo.png" />
    <link rel="apple-touch-icon" href="/widedrop-logo.png" />

    <!-- The two font files that render the first paint. The rest load on demand
         through their unicode-range. -->
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          max-width: 34rem;
          margin: 4rem auto;
          padding: 1.5rem;
          border: 1px solid #263247;
          border-radius: 12px;
          background: #121b2b;
          color: #f2f5fa;
          font-family: system-ui, sans-serif;
        "
      >
        <h1 style="font-size: 1.05rem; margin-bottom: 0.5rem">JavaScript is required</h1>
        <p style="color: #a9b4c7; font-size: 0.875rem; line-height: 1.6">
          The Widedrop employee portal needs JavaScript enabled. If it is blocked by a company
          policy on this device, contact
          <a href="mailto:helpdesk@widedroptech.com" style="color: #6ea8ff"
            >helpdesk@widedroptech.com</a
          >.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
